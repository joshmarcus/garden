name: context-garden
runner: local
work_dir: /home/joshua/work
harness: codex
max_parallel: 1
review_parallel: 1
resources:
  max_parallel: 1
  min_memory_available_mb: 1536
  min_temp_free_mb: 1024
  windows_backing_path: C:\Users\joshm\AppData\Local\wsl\{dd32a113-df46-4ddc-a093-cdc75285d2a0}
max_attempts: 2
max_revisions: 6
timeout_minutes: 90
tick_interval: 60
auto_dispatch: true
auto_revise: true
plan:
  auto_approve: true
stack: true
discovered:
  auto_approve_blocking: true
stall:
  enabled: true
budgets:
  context-garden/phase-02-friction: 2000.0
review:
  enabled: true
  max_rounds: null
  max_diff_chars: 60000
  harness: codex
  difficulty: hard
  personas: []
checks:
  pre_pr:
  - name: lint
    command: "case \"$GARDEN_PRODUCT\" in\n  context-garden) .venv/bin/ruff check\
      \ src tests scripts ;;\n  garden) echo \"Context documents: no configured code\
      \ suite\" ;;\n  *) echo \"No pre-PR policy for product: $GARDEN_PRODUCT\" >&2;\
      \ exit 1 ;;\nesac\n"
  ci:
  - name: actions
    python: garden.checks:github_actions_failures
    flaky_patterns:
    - ETIMEDOUT
    - ECONNRESET
    - rate limit
    rerun: true
  timeout_seconds: 900
brief:
  inline_max_chars: 24000
  total_max_chars: 120000
harnesses:
  claude:
    bin: claude
    output_format: stream-json
    permission_mode: acceptEdits
    review_model: ''
    retro_model: claude-fable-5-1
    allowed_tools:
    - Bash
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - MultiEdit
    models:
      easy: claude-sonnet-5
      medium: claude-sonnet-5
      hard: claude-opus-4-8
    resume: true
  codex:
    bin: codex
    permission_mode: bypass
    review_model: ''
    retro_model: gpt-6-astra
    models:
      easy: gpt-5.6-luna
      medium: gpt-5.6-terra
      hard: gpt-5.6-sol
    resume: false
ssh:
  hosts: []
github:
  automerge: true
  automerge_method: merge
  bot_logins: []
  use_gh: true
  draft_pr: false
  reviewers: []
products:
  garden:
    repo: https://github.com/joshmarcus/garden.git
    base_branch: main
    id_prefix: GD
    self: true
  context-garden:
    repo: https://github.com/joshmarcus/context-garden.git
    base_branch: main
    id_prefix: CG
    setup:
      command: python3 -m venv .venv && .venv/bin/pip install -q -e '.[dev]' && .venv/bin/python
        -m pip install -q --no-deps pytest-timeout==2.4.0
      worker_push: false
      lint: .venv/bin/ruff check src tests scripts
      env:
        GH_CONFIG_DIR: /home/joshua/.config/gh
        PLAYWRIGHT_BROWSERS_PATH: /home/joshua/.cache/ms-playwright
      timeout_seconds: 1500
worker_env:
  pass:
  - LD_LIBRARY_PATH
  - PLAYWRIGHT_BROWSERS_PATH
web:
  trusted_origins:
  - https://babel.taild4d2ae.ts.net
